<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simple Web UI</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 2rem;
    background-color: #f4f6f8;
    color: #333;
  }
  h1 {
    color: #005f73;
  }
  label, input {
    font-size: 1rem;
  }
  input {
    padding: 0.5rem;
    margin-right: 1rem;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  button {
    background-color: #0a9396;
    color: white;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 5px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover {
    background-color: #007f87;
  }
  #message {
    margin-top: 1rem;
    font-size: 1.2rem;
    color: #001219;
  }
</style>
</head>
<body>
  <h1>Simple Web UI Example</h1>
  <label for="nameInput">Enter your name:</label>
  <input type="text" id="nameInput" placeholder="Your name" />
  <button id="clickMeBtn">Click Me</button>
  <div id="message" aria-live="polite"></div>

<script>
  const btn = document.getElementById('clickMeBtn');
  const messageDiv = document.getElementById('message');
  const nameInput = document.getElementById('nameInput');

  btn.addEventListener('click', () => {
    const name = nameInput.value.trim();
    if (name) {
      messageDiv.textContent = `Hello, ${name}! Welcome to your simple web UI!`;
    } else {
      messageDiv.textContent = 'Please enter your name first!';
    }
  });
</script>
</body>
</html>
