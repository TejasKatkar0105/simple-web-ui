<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Simple Web UI</title>
<style>
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    margin: 2rem;
    background-color: #f4f6f8;
    color: #333;
  }
  h1 {
    color: #005f73;
  }
  button {
    background-color: #0a9396;
    color: white;
    border: none;
    padding: 0.6rem 1.2rem;
    border-radius: 5px;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover {
    background-color: #007f87;
  }
  #message {
    margin-top: 1rem;
    font-size: 1.2rem;
    color: #001219;
  }
</style>
</head>
<body>
  <h1>Simple Web UI Example</h1>
  <button id="clickMeBtn">Click Me</button>
  <div id="message"></div>

<script>
  const btn = document.getElementById('clickMeBtn');
  const messageDiv = document.getElementById('message');

  btn.addEventListener('click', () => {
    messageDiv.textContent = 'Hello from your simple web UI!';
  });
</script>
</body>
</html>
